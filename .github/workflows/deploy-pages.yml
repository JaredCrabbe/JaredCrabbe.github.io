name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # The base path is worked out from GITHUB_REPOSITORY by vite.config.ts:
      #   repo named "<owner>.github.io" or a custom domain -> "/"
      #   any other repo                                      -> "/<repo-name>/"
      # Set a repository variable PAGES_BASE (Settings -> Secrets and variables ->
      # Actions -> Variables) to force a different base, e.g. "/" for a custom domain.
      - run: bun run build
        env:
          PAGES_BASE: ${{ vars.PAGES_BASE }}

      # Locally the static site lands in dist/client; on GitHub's runners the
      # build writes it to .output/public. Publish whichever exists.
      - name: Locate static output
        id: pages-dir
        run: |
          if [ -f ".output/public/index.html" ]; then dir=".output/public"
          elif [ -f "dist/client/index.html" ]; then dir="dist/client"
          else echo "No built index.html found" >&2; exit 1; fi
          touch "$dir/.nojekyll"
          echo "path=$dir" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.pages-dir.outputs.path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
